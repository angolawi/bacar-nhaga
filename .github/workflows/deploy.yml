name: Deploy to GitHub Pages with Secure Pix Secret

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qrcode[pil]

      - name: Build Secure Pix & Inject Secrets
        env:
          # Segredos lidos das configurações de Secrets do repositório
          # Caso não estejam definidos nos Secrets, o script utiliza valores padrão seguros
          PIX_KEY: ${{ secrets.PIX_KEY || '+5561992454063' }}
          PIX_NAME: ${{ secrets.PIX_NAME || 'BACAR NHAGA' }}
          PIX_CITY: ${{ secrets.PIX_CITY || 'BRASILIA' }}
          PIX_KEY_FORMATTED: ${{ secrets.PIX_KEY_FORMATTED || '(61) 99245-4063' }}
        run: |
          python3 scripts/build_pix.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
